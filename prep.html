<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>تحضير لقاء المغامرين · نادي مهارة</title>
<link rel="icon" href="assets/icon.png">
<style>
  :root{color-scheme:light;--navy:#27378a;--ink:#141a33;--muted:#5d6788;--line:#dfe3f0;--soft:#f4f6fc;--gold:#b58a12}
  *{box-sizing:border-box}body{margin:0;background:#eef1f8;color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;line-height:1.7}
  .page{max-width:900px;margin:0 auto;padding:20px 16px 50px}
  header.hd{background:var(--navy);color:#fff;border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:center}
  header.hd img{height:48px}header.hd h1{margin:0;font-size:1.5rem}header.hd p{margin:0;color:#c9d2ff}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:14px 0}
  .meta div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}.meta small{display:block;color:var(--muted)}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
  .box h2{margin:0 0 6px;font-size:1.15rem;color:var(--navy)}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top;font-size:.95rem}th{background:var(--soft);color:var(--muted);font-weight:600}
  td.t{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--navy);font-weight:700}
  .seg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;break-inside:avoid}
  .seg h3{margin:0;font-size:1.1rem}.seg .sub{color:var(--muted);font-size:.9rem}
  .rule{background:#fff8e6;border:1px solid #f0d78a;border-radius:10px;padding:8px 12px;margin:8px 0}
  .lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.lv div{background:var(--soft);border-radius:8px;padding:6px 8px;font-size:.9rem}
  ol,ul{margin:6px 0;padding-inline-start:20px}
  .foot{color:var(--muted);font-size:.85rem;text-align:center;margin-top:20px}
  .noprint{margin:12px 0}.noprint button{font:inherit;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
  @media print{body{background:#fff}.noprint{display:none}.page{padding:0}}
  @media (max-width:640px){.lv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page" id="root"><p>جاري التحميل…</p></div>
<script type="module" src="js/prep.js"></script>
</body>
</html>
