<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>الموسم الأول · المغامرون</title>
<link rel="icon" href="assets/icon.png">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#e8ecff;font-family:Tahoma,sans-serif}
  .wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  video{width:100vw;height:100vh;object-fit:contain;background:#000}
  .tip{position:fixed;inset:auto 0 14px 0;text-align:center;font-size:14px;color:#8f9bcb;pointer-events:none;opacity:.8}
  @media (hover:hover){.tip{opacity:0;transition:opacity .3s}body:hover .tip{opacity:.8}}
</style>
</head>
<body>
<div class="wrap">
  <video src="assets/film/season1.mp4" poster="assets/film/season1.jpg" controls preload="auto" playsinline></video>
</div>
<div class="tip">اضغط ⛶ في المشغّل لملء الشاشة · ارفع صوت الجهاز والتلفاز قبل التشغيل</div>
</body>
</html>
