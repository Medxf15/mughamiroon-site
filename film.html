<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#04050c">
<title>طريق الحادي · الحلقة صفر</title>
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
  :root{color-scheme:dark;--bg:#04050c;--fg:#e8ecff;--muted:#8f9bcb;--line:#243063;--card:#0f1633;--gold:#ffcf6b}
  *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Readex Pro",Tahoma,sans-serif}
  a{color:#9fb4ff}
  /* player */
  .stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .stage canvas{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
  .start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#1a2560,#04050c 70%);cursor:pointer;z-index:2;text-align:center}
  .start b{font-size:clamp(2rem,6vw,5rem);display:block}.start span{color:var(--muted);font-size:clamp(1rem,2vw,1.5rem)}
  .start i{display:inline-grid;place-items:center;width:110px;height:110px;border-radius:50%;background:var(--gold);color:#1a1300;font-style:normal;font-size:3rem;margin:24px auto}
  .hud{position:fixed;inset:auto 0 0 0;padding:10px 16px;display:flex;gap:10px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.7));opacity:0;transition:.3s;z-index:3}
  body:hover .hud{opacity:1}.hud button{background:#1b2550;border:1px solid var(--line);color:#fff;border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
  .hud input{flex:1}
  .vstat{color:#ffcf6b;font-size:clamp(.9rem,1.6vw,1.2rem);margin-top:14px}
  /* storyboard */
  .board{max-width:1500px;margin:0 auto;padding:20px 16px 60px}
  .board h1{margin:0 0 4px}.board .sub{color:var(--muted);margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  .sc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .sc canvas{width:100%;aspect-ratio:16/9;display:block;background:#000}
  .sc div{padding:12px 14px;display:grid;gap:6px}.sc h2{margin:0;font-size:1.1rem}.sc small{color:var(--gold);font-variant-numeric:tabular-nums}.sc p{margin:0;color:#cfd6ff;line-height:1.7;font-size:.95rem}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.bar a{background:#1b2550;border:1px solid var(--line);border-radius:999px;padding:6px 14px;text-decoration:none;color:#fff}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="js/film-page.js"></script>
</body>
</html>
